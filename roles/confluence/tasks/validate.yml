---
###############################################################################
# Validate Confluence Installation
###############################################################################

- name: Wait for Confluence service
  wait_for:
    host: 127.0.0.1
    port: "{{ confluence_http_port }}"
    delay: 10
    timeout: 300

###############################################################################
# Check HTTP Response
###############################################################################

- name: Check Confluence HTTP endpoint
  uri:
    url: "http://127.0.0.1:{{ confluence_http_port }}"
    method: GET
    status_code:
      - 200
      - 302
      - 303
      - 500
    follow_redirects: none
  register: confluence_http
  failed_when: false

###############################################################################
# Check Setup Wizard
###############################################################################

- name: Check Confluence setup page
  uri:
    url: "http://127.0.0.1:{{ confluence_http_port }}/setup/setupstart.action"
    method: GET
    status_code:
      - 200
      - 302
      - 303
      - 500
    follow_redirects: none
  register: confluence_setup
  failed_when: false

###############################################################################
# Show Service Status
###############################################################################

- name: Show Confluence HTTP status
  debug:
    msg:
      - "HTTP Status  : {{ confluence_http.status | default('Unknown') }}"
      - "Setup Status : {{ confluence_setup.status | default('Unknown') }}"

###############################################################################
# Installation Summary
###############################################################################

- name: Confluence installation summary
  debug:
    msg:
      - "======================================================="
      - "Confluence Infrastructure Installation Completed"
      - ""
      - "Service           : confluence"
      - "Install Directory : {{ confluence_install_dir }}"
      - "Home Directory    : {{ confluence_home }}"
      - "HTTP Port         : {{ confluence_http_port }}"
      - "Database          : {{ postgres_database }}"
      - ""
      - "Next Step:"
      - "Open the following URL in your browser:"
      - ""
      - "http://{{ ansible_default_ipv4.address | default(inventory_hostname) }}:{{ confluence_http_port }}"
      - ""
      - "Complete the Confluence Setup Wizard."
      - ""
      - "After the wizard finishes successfully,"
      - "run bootstrap_confluence.yml."
      - "======================================================="

- name: Display Next Step
  debug:
    msg:
      - ""
      - "=============================================="
      - "Infrastructure installation completed."
      - ""
      - "NEXT:"
      - "1. Open browser"
      - "2. Complete Confluence Setup Wizard"
      - "3. Verify database schema is created"
      - "4. Run:"
      - ""
      - "ansible-playbook playbooks/bootstrap_confluence.yml"
      - ""
      - "=============================================="
