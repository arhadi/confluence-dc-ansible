---
# ------------------------------------------------------------
# Validate Confluence Installation
# ------------------------------------------------------------

- name: Wait for Confluence service
  wait_for:
    host: 127.0.0.1
    port: "{{ confluence_http_port }}"
    delay: 10
    timeout: 300

# ------------------------------------------------------------
# Check HTTP Response
# ------------------------------------------------------------

- name: Check Confluence HTTP endpoint
  uri:
    url: "http://127.0.0.1:{{ confluence_http_port }}"
    method: GET
    status_code:
      - 200
      - 302
      - 303
      - 500
    follow_redirects: none
  register: confluence_http
  failed_when: false

# ------------------------------------------------------------
# Check Setup Wizard
# ------------------------------------------------------------

- name: Check Confluence setup page
  uri:
    url: "http://127.0.0.1:{{ confluence_http_port }}/setup/setupstart.action"
    method: GET
    status_code:
      - 200
      - 302
      - 303
      - 500
    follow_redirects: none
  register: confluence_setup
  failed_when: false

# ------------------------------------------------------------
# Show Service Status
# ------------------------------------------------------------

- name: Show Confluence HTTP status
  debug:
    msg:
      - "HTTP Status  : {{ confluence_http.status | default('Unknown') }}"
      - "Setup Status : {{ confluence_setup.status | default('Unknown') }}"

# ------------------------------------------------------------
# Installation Summary
# ------------------------------------------------------------

- name: Confluence installation summary
  ansible.builtin.debug:
    msg:
      - "========================================"
      - "Confluence installation completed"
      - "Version     : {{ confluence_version }}"
      - "Install Dir : {{ confluence_install_dir }}"
      - "Home Dir    : {{ confluence_home }}"
      - "HTTP Port   : {{ confluence_http_port }}"
      - "Database    : {{ postgres_database }}"
      - "Service     : {{ confluence_service_name }}"
      - "========================================"
      - "Next: Complete setup at http://{{ ansible_default_ipv4.address }}:{{ confluence_http_port }}"
      - "Then run: ansible-playbook playbooks/bootstrap_confluence.yml"
