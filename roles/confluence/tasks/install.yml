---
# ------------------------------------------------------------
# Confluence Installation Method Dispatcher
# ------------------------------------------------------------

- name: Display selected Confluence installation method
  ansible.builtin.debug:
    msg:
      - "========================================"
      - "Confluence installation"
      - "Version : {{ confluence_version }}"
      - "Method  : {{ confluence_install_method }}"
      - "========================================"

- name: Validate Confluence installation method
  ansible.builtin.assert:
    that:
      - confluence_install_method in ['archive', 'installer']
    fail_msg: >-
      Invalid confluence_install_method={{ confluence_install_method }}.
      Supported methods are archive and installer.

# ------------------------------------------------------------
# Archive Installation
# ------------------------------------------------------------

- name: Install Confluence using archive
  ansible.builtin.include_tasks: install_archive.yml
  when: confluence_install_method == "archive"

# ------------------------------------------------------------
# Linux Binary Installer
# ------------------------------------------------------------

- name: Install Confluence using Linux binary installer
  ansible.builtin.include_tasks: install_installer.yml
  when: confluence_install_method == "installer"
