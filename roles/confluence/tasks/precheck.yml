---

- name: Display Confluence variables
  ansible.builtin.debug:
    msg:
      - "========================================"
      - "Confluence Precheck"
      - "Version           : {{ confluence_version }}"
      - "Install Method    : {{ confluence_install_method }}"
      - "Archive           : {{ confluence_archive }}"
      - "Binary Installer  : {{ confluence_installer }}"
      - "Install Directory : {{ confluence_install_dir }}"
      - "Home Directory    : {{ confluence_home }}"
      - "Database          : {{ postgres_database }}"
      - "DB Host           : {{ postgres_host }}"
      - "HTTP Port         : {{ confluence_http_port }}"
      - "Cluster Enabled   : {{ confluence_cluster_enabled }}"
      - "========================================"

- name: Check operating system
  assert:
    that:
      - ansible_distribution == "RedHat"
      - ansible_distribution_major_version | int == 9
    fail_msg:
      - "Only RHEL 9 is supported"

# ------------------------------------------------------------
# Validate Installation Method
# ------------------------------------------------------------

- name: Validate Confluence installation method
  ansible.builtin.assert:
    that:
      - confluence_install_method in ['archive', 'installer']
    fail_msg: >-
      Invalid confluence_install_method={{ confluence_install_method }}.
      Supported methods are archive and installer.

# ------------------------------------------------------------
# Archive Installer Precheck
# ------------------------------------------------------------

- name: Check Confluence archive
  ansible.builtin.stat:
    path: "{{ confluence_archive_path }}"
    checksum_algorithm: sha256
  register: confluence_archive_check
  when: confluence_install_method == "archive"

- name: Validate Confluence archive exists
  ansible.builtin.assert:
    that:
      - confluence_archive_check.stat.exists
    fail_msg: "Missing Confluence archive: {{ confluence_archive_path }}"
  when: confluence_install_method == "archive"

- name: Verify Confluence archive SHA256 checksum
  ansible.builtin.assert:
    that:
      - confluence_archive_check.stat.checksum == confluence_archive_sha256
    fail_msg: |
      Confluence archive checksum verification failed.

      Expected:
      {{ confluence_archive_sha256 }}

      Actual:
      {{ confluence_archive_check.stat.checksum }}

    success_msg: "Confluence archive checksum verified successfully."
  when: confluence_install_method == "archive"

# ------------------------------------------------------------
# Linux Binary Installer Precheck
# ------------------------------------------------------------

- name: Check Confluence binary installer
  ansible.builtin.stat:
    path: "{{ confluence_installer_path }}"
    checksum_algorithm: sha256
  register: confluence_installer_check
  when: confluence_install_method == "installer"

- name: Validate Confluence binary installer exists
  ansible.builtin.assert:
    that:
      - confluence_installer_check.stat.exists
    fail_msg: "Missing Confluence binary installer: {{ confluence_installer_path }}"
  when: confluence_install_method == "installer"

- name: Verify Confluence binary installer SHA256 checksum
  ansible.builtin.assert:
    that:
      - confluence_installer_check.stat.checksum == confluence_installer_sha256
    fail_msg: |
      Confluence binary installer checksum verification failed.

      Expected:
      {{ confluence_installer_sha256 }}

      Actual:
      {{ confluence_installer_check.stat.checksum }}

    success_msg: "Confluence binary installer checksum verified successfully."
  when: confluence_install_method == "installer"

# ------------------------------------------------------------
# Check Java
# ------------------------------------------------------------

- name: Check Java installation
  command:
    java -version
  register:
    java_check
  changed_when:
    false
  failed_when:
    false

- name: Detect Java home
  shell: |
    dirname $(dirname $(readlink -f $(which java)))
  register:
    detected_java_home
  changed_when:
    false

- name: Set Java home fact
  set_fact:
    java_home:
      "{{ detected_java_home.stdout }}"

- name: Validate Java home is JDK
  stat:
    path:
      "{{ java_home }}/bin/javac"
  register:
    java_compiler

- name: Fail if JDK is missing
  assert:
    that:
      - java_compiler.stat.exists
    fail_msg:
      - "JAVA_HOME does not point to a JDK: {{ java_home }}"

- name: Display Java version
  debug:
    var:
      java_check.stderr_lines

- name: Check confluence user
  getent:
    database:
      passwd
    key:
      "{{ confluence_user }}"
  register:
    confluence_user_check
  failed_when:
    false

- name: Check available disk space
  ansible.builtin.shell: |
    df -BG {{ confluence_install_parent }} | tail -1 | awk '{print $4}' | sed 's/G//'
  register: confluence_disk
  changed_when: false

- name: Validate disk space
  assert:
    that:
      - confluence_disk.stdout | int >= 10
    fail_msg:
      - "Insufficient disk space on {{ confluence_install_parent }}"

- name: Test PostgreSQL connectivity
  wait_for:
    host:
      "{{ postgres_host }}"
    port:
      "{{ postgres_port }}"
    timeout:
      10
  register:
    postgres_check

- name: PostgreSQL connectivity result
  debug:
    msg:
      - "PostgreSQL reachable"
      - "Host: {{ postgres_host }}"
      - "Port: {{ postgres_port }}"
